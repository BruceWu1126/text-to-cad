interface:
  display_name: "PCB"
  short_description: "Design circuit boards as Python scripts on KiCad's own API."
  default_prompt: "Use $pcb to design or edit a printed circuit board as a Python @pcb script on KiCad's API: declare its footprint libraries, place and hand-route it, set its design rules, build it with the KiCad nightly, check it with cadgen pcb drc, export what the fab needs, and launch CAD Viewer to show the board."
